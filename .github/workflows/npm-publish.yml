# Publishes the package to npm when a GitHub release is published.
#
# A normal release goes to the `latest` dist-tag. A release marked as a
# prerelease goes to `alpha`, so an unfinished version never becomes what
# `^` and unpinned installs resolve to.
#
# Auth is npm trusted publishing over OIDC, so there is no npm token here.
# That also means every version published this way carries a provenance
# attestation, which is how you tell it from a publish run by hand.

name: Node.js Package

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - run: pnpm install --frozen-lockfile
      # Publish with npm (not pnpm) so npm provenance / trusted publishing works.
      - run: |
          if ${{ github.event.release.prerelease }}; then
            npm publish --provenance --tag alpha
          else
            npm publish --provenance
          fi
