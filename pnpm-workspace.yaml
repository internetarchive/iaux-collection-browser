# Strict, symlinked node_modules: this package sees only its declared
# dependencies, so an undeclared (phantom) import fails here rather than in a
# consumer whose tree happens to hoist it.
nodeLinker: isolated

# Supply-chain cooldown (WEBDEV-8544): don't install a package version until it
# has been published for at least this long, giving a compromised release time to
# be detected and yanked before it reaches us. Value is in MINUTES — 20160 = 14 days.
# pnpm enforces this when the lockfile is updated (pnpm add / pnpm update); CI's
# `pnpm install --frozen-lockfile` just reproduces the vetted lockfile, so the gate
# never blocks a build.
#
# @internetarchive/* is excluded: those are our own trusted packages and are
# frequently republished — we want them available immediately.
minimumReleaseAge: 20160
minimumReleaseAgeExclude:
  - '@internetarchive/*'

# @open-wc/testing@4.0.0 pulls two @types/chai majors through its own
# transitive deps (@esm-bundle/chai wants ^4, @types/chai-dom and
# @types/sinon-chai want ^5). nodeLinker: isolated keeps both physically
# present, so tsc sees duplicate global declarations. Force v4: @open-wc's
# own index.d.ts does a default import of chai, which v5 (ESM-only) dropped.
overrides:
  '@types/chai': ^4.3.20

# unrs-resolver's postinstall places its native binding; eslint-plugin-import
# depends on it for module resolution.
allowBuilds:
  unrs-resolver: true
